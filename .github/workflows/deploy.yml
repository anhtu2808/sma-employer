name: CI/CD SMA Employer

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy SMA Employer
    runs-on: ubuntu-latest
    environment: PROD

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm ci

      - name: Build
        env:
          REACT_APP_API_URL: ${{ vars.DOMAIN }}
        run: |
          CI=false npm run build

      - name: Copy Build Files to Server
        uses: appleboy/scp-action@master
        with:
          host: ${{ vars.HOST_IP }}
          username: root
          key: ${{ secrets.SECRET_KEY }}
          source: "build/*"
          target: "/var/www/sma-employer"
          strip_components: 1

      - name: Finalize Deployment
        uses: appleboy/ssh-action@master
        with:
          host: ${{ vars.HOST_IP }}
          username: root
          key: ${{ secrets.SECRET_KEY }}
          script: |
            chown -R www-data:www-data /var/www/sma-employer
